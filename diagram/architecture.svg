<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowDeny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">
    Hub-and-Spoke Network Architecture with Zero-Trust Access Control
  </text>
  <text x="600" y="56" text-anchor="middle" font-size="12" fill="#64748b">
    All egress and inter-spoke traffic forced through Azure Firewall. No spoke-to-spoke peering. No public management ports.
  </text>

  <!-- Internet -->
  <rect x="530" y="80" width="140" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="105" text-anchor="middle" font-size="12" fill="#334155">Internet</text>

  <!-- HUB VNET -->
  <rect x="380" y="150" width="440" height="230" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="600" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">
    HUB VNet - Platform Subscription - 10.0.0.0/16
  </text>

  <!-- Firewall -->
  <rect x="405" y="195" width="170" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.75"/>
  <text x="490" y="217" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Azure Firewall</text>
  <text x="490" y="232" text-anchor="middle" font-size="10" fill="#7f1d1d">Standard | Deny Threat Intel</text>
  <text x="490" y="246" text-anchor="middle" font-size="10" fill="#7f1d1d">AzureFirewallSubnet /26</text>
  <text x="490" y="258" text-anchor="middle" font-size="9" fill="#991b1b">Public IP (SNAT egress only)</text>

  <!-- Bastion -->
  <rect x="625" y="195" width="170" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.75"/>
  <text x="710" y="217" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Azure Bastion</text>
  <text x="710" y="232" text-anchor="middle" font-size="10" fill="#1e3a8a">Standard | Native Tunneling</text>
  <text x="710" y="246" text-anchor="middle" font-size="10" fill="#1e3a8a">AzureBastionSubnet /26</text>
  <text x="710" y="258" text-anchor="middle" font-size="9" fill="#1e40af">Public IP (mgmt access only)</text>

  <!-- Shared services subnet -->
  <rect x="405" y="285" width="390" height="55" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="600" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Shared Services Subnet /25 (reserved)</text>
  <text x="600" y="323" text-anchor="middle" font-size="9" fill="#64748b">AMPLS private endpoints - not yet provisioned</text>

  <!-- Firewall public IP to Internet -->
  <line x1="490" y1="195" x2="590" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PRODUCTION SPOKE -->
  <rect x="60" y="450" width="440" height="300" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="280" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">
    PRODUCTION Spoke - 10.1.0.0/16
  </text>

  <rect x="85" y="492" width="120" height="52" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.25"/>
  <text x="145" y="513" text-anchor="middle" font-size="10.5" font-weight="600" fill="#065f46">App Subnet</text>
  <text x="145" y="527" text-anchor="middle" font-size="9" fill="#047857">10.1.0.0/24</text>
  <text x="145" y="539" text-anchor="middle" font-size="8.5" fill="#047857">UDR + NSG</text>

  <rect x="220" y="492" width="120" height="52" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.25"/>
  <text x="280" y="513" text-anchor="middle" font-size="10.5" font-weight="600" fill="#065f46">Private Endpoints</text>
  <text x="280" y="527" text-anchor="middle" font-size="9" fill="#047857">10.1.1.0/24</text>
  <text x="280" y="539" text-anchor="middle" font-size="8.5" fill="#047857">UDR + NSG</text>

  <rect x="355" y="492" width="120" height="52" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.25"/>
  <text x="415" y="513" text-anchor="middle" font-size="10.5" font-weight="600" fill="#065f46">AKS Node Subnet</text>
  <text x="415" y="527" text-anchor="middle" font-size="9" fill="#047857">10.1.16.0/22</text>
  <text x="415" y="539" text-anchor="middle" font-size="8.5" fill="#047857">provisioned, unused</text>

  <rect x="85" y="562" width="390" height="40" rx="6" fill="#f0fdf4" stroke="#047857" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="280" y="586" text-anchor="middle" font-size="9.5" fill="#065f46">Route Table: 0.0.0.0/0 -&gt; Firewall private IP | bgp_route_propagation_enabled = false</text>

  <rect x="85" y="618" width="390" height="40" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1"/>
  <text x="280" y="638" text-anchor="middle" font-size="9.5" fill="#065f46">2 NSGs per env | VNet Flow Logs -&gt; storage | Network Watcher</text>
  <text x="280" y="651" text-anchor="middle" font-size="8.5" fill="#047857">No public IP on any workload NIC</text>

  <!-- Test VM icon -->
  <rect x="200" y="670" width="160" height="40" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.25"/>
  <text x="280" y="694" text-anchor="middle" font-size="10" fill="#9a3412">vm-test-production (validation)</text>

  <!-- NONPROD SPOKE -->
  <rect x="700" y="450" width="440" height="300" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="920" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">
    NONPROD Spoke - 10.2.0.0/16
  </text>

  <rect x="725" y="492" width="120" height="52" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="1.25"/>
  <text x="785" y="513" text-anchor="middle" font-size="10.5" font-weight="600" fill="#9a3412">App Subnet</text>
  <text x="785" y="527" text-anchor="middle" font-size="9" fill="#c2410c">10.2.0.0/24</text>
  <text x="785" y="539" text-anchor="middle" font-size="8.5" fill="#c2410c">UDR + NSG</text>

  <rect x="860" y="492" width="120" height="52" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="1.25"/>
  <text x="920" y="513" text-anchor="middle" font-size="10.5" font-weight="600" fill="#9a3412">Private Endpoints</text>
  <text x="920" y="527" text-anchor="middle" font-size="9" fill="#c2410c">10.2.1.0/24</text>
  <text x="920" y="539" text-anchor="middle" font-size="8.5" fill="#c2410c">UDR + NSG</text>

  <rect x="995" y="492" width="120" height="52" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="1.25"/>
  <text x="1055" y="513" text-anchor="middle" font-size="10.5" font-weight="600" fill="#9a3412">AKS Node Subnet</text>
  <text x="1055" y="527" text-anchor="middle" font-size="9" fill="#c2410c">10.2.16.0/23</text>
  <text x="1055" y="539" text-anchor="middle" font-size="8.5" fill="#c2410c">provisioned, unused</text>

  <rect x="725" y="562" width="390" height="40" rx="6" fill="#fffbeb" stroke="#c2410c" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="920" y="586" text-anchor="middle" font-size="9.5" fill="#9a3412">Route Table: 0.0.0.0/0 -&gt; Firewall private IP | bgp_route_propagation_enabled = false</text>

  <rect x="725" y="618" width="390" height="40" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="1"/>
  <text x="920" y="638" text-anchor="middle" font-size="9.5" fill="#9a3412">2 NSGs per env | VNet Flow Logs -&gt; storage | Network Watcher</text>
  <text x="920" y="651" text-anchor="middle" font-size="8.5" fill="#c2410c">No public IP on any workload NIC</text>

  <rect x="840" y="670" width="160" height="40" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.25"/>
  <text x="920" y="694" text-anchor="middle" font-size="10" fill="#9a3412">vm-test-non-production (validation)</text>

  <!-- Peering lines: hub to each spoke, bidirectional -->
  <line x1="490" y1="380" x2="280" y2="450" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="345" y="420" font-size="9.5" fill="#334155" transform="rotate(-31 345 420)">peer-hub&lt;-&gt;production</text>

  <line x1="710" y1="380" x2="920" y2="450" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="855" y="420" font-size="9.5" fill="#334155" transform="rotate(31 855 420)">peer-hub&lt;-&gt;nonprod</text>

  <!-- Explicit NO peering between spokes -->
  <line x1="500" y1="600" x2="700" y2="600" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-start="url(#arrowDeny)" marker-end="url(#arrowDeny)"/>
  <text x="600" y="592" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">NO DIRECT PEERING</text>
  <text x="600" y="616" text-anchor="middle" font-size="8.5" fill="#b91c1c">validated: nc timeout, denied in Firewall logs</text>

  <!-- LOG ANALYTICS -->
  <rect x="60" y="770" width="1080" height="40" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.75"/>
  <text x="600" y="795" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">
    Centralized Log Analytics (log-hub-shared) &#8592; Firewall diagnostics + Bastion audit logs (MicrosoftAzureBastionAuditLogs)
  </text>

  <line x1="490" y1="265" x2="200" y2="770" stroke="#6d28d9" stroke-width="1" stroke-dasharray="2,3" opacity="0.5"/>
  <line x1="710" y1="265" x2="1000" y2="770" stroke="#6d28d9" stroke-width="1" stroke-dasharray="2,3" opacity="0.5"/>
</svg>
